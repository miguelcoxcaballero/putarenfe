name: Comprobar narración e imágenes en Pages
on:
  push:
    branches: [codex/narracion-publica]
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preparar navegador
        working-directory: iberia-ferroviaria/proyecto
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verificar las voces nuevas en la web pública
        working-directory: iberia-ferroviaria/proyecto
        env:
          GAME_TEST_URL: https://miguelcoxcaballero.github.io/putarenfe/iberia-ferroviaria/
        run: node narracion-ui-test.mjs
      - name: Diagnosticar las 28 cargas de interiores por HTTPS
        working-directory: iberia-ferroviaria/proyecto
        run: |
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright';
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          const url='https://miguelcoxcaballero.github.io/putarenfe/iberia-ferroviaria/';
          const release=JSON.parse(fs.readFileSync('../release.json'));
          const browser=await chromium.launch({args:['--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader']});
          try{
           const page=await browser.newPage({viewport:{width:1440,height:960}});
           const failures=[];
           page.on('requestfailed',r=>failures.push({url:r.url(),error:r.failure()}));
           page.on('response',r=>{if(r.status()>=400)failures.push({url:r.url(),status:r.status()});});
           await page.goto(url);await page.locator('[data-action="new-game"]').click();await page.locator('#npGuide').uncheck();
           await page.locator('[data-action="np-begin"]').click();await page.locator('[data-action="welcome-close"]').click();
           await page.locator('#navigation [data-screen="fleet"]').click();await page.locator('#drawer .tabs [data-action="fleet-tab"][data-id="refits"]').click();
           await page.locator('[data-action="refit-view"][data-id="catalogue"]').click();
           const images=await page.locator('.refit-catalogue img').evaluateAll(imgs=>imgs.map(i=>({src:i.src,model:i.dataset.model,interior:i.dataset.interior})));
           if(images.length!==28)throw Error('Incomplete gallery');
           for(const row of images){
            const response=await page.request.get(row.src);
            const bytes=await response.body(),hash=createHash('sha256').update(bytes).digest('hex');
            const path=new URL(row.src).pathname.slice(new URL(url).pathname.length),expected=release.assets.find(a=>a.url===path);
            console.log('INTERIOR_HTTP',JSON.stringify({...row,status:response.status(),type:response.headers()['content-type'],bytes:bytes.length,hash,expected:expected?.sha256}));
            if(!response.ok()||hash!==expected?.sha256)throw Error('Incorrect HTTPS image: '+row.src);
            const decoded=await page.evaluate(async src=>{const image=new Image();image.src=src;try{await image.decode();return {width:image.naturalWidth,height:image.naturalHeight};}catch(error){return {error:String(error),src};}},row.src);
            console.log('INTERIOR_DECODE',JSON.stringify({...row,...decoded}));
            if(decoded.width!==1536||decoded.height!==1024)throw Error('Decode failed: '+JSON.stringify(decoded));
           }
           console.log('INTERIOR_NETWORK_FAILURES',JSON.stringify(failures));
           console.log('INTERIOR_HTTPS_COMPLETE',images.length);
          }finally{await browser.close();}
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: narracion-pages-qa
          path: iberia-ferroviaria/outputs/tenfe-qa
