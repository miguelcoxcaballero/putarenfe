name: Verificar audio compatible con Brave y móviles
on:
  push:
    branches: [codex/audio-compatible, main]
concurrency:
  group: audio-restaurado-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar el juego, voces y banda sonora
        if: github.ref != 'refs/heads/main'
        working-directory: iberia-ferroviaria/proyecto
        run: |
          npm test
          node music-test.mjs
          node voice-text-test.mjs
      - name: Instalar herramientas de navegador y grabación
        working-directory: iberia-ferroviaria/proyecto
        run: |
          npm install --no-save --package-lock=false sharp@0.34.5 playwright@1.56.1
          npx playwright install --with-deps chromium firefox webkit
          sudo curl -fsSLo /usr/share/keyrings/brave-browser-archive-keyring.gpg https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
          echo 'deb [signed-by=/usr/share/keyrings/brave-browser-archive-keyring.gpg] https://brave-browser-apt-release.s3.brave.com/ stable main' | sudo tee /etc/apt/sources.list.d/brave-browser-release.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq brave-browser pulseaudio ffmpeg xvfb
      - name: Construir la versión corregida
        if: github.ref != 'refs/heads/main'
        working-directory: iberia-ferroviaria/proyecto
        run: npm run web:build
      - name: Esperar la versión publicada
        if: github.ref == 'refs/heads/main'
        working-directory: iberia-ferroviaria
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          const digest=b=>createHash('sha256').update(b).digest('hex');
          const expected=digest(fs.readFileSync('release.json'));
          let ready=false;
          for(let i=0;i<40;i++){
            try{
              const r=await fetch('https://miguelcoxcaballero.github.io/putarenfe/iberia-ferroviaria/release.json?audio='+Date.now(),{signal:AbortSignal.timeout(15000)});
              if(r.ok&&digest(Buffer.from(await r.arrayBuffer()))===expected){ready=true;break;}
            }catch{}
            await new Promise(resolve=>setTimeout(resolve,15000));
          }
          if(!ready)throw Error('Pages no ha publicado esta versión');
          NODE
      - name: Grabar y verificar música, voces y efectos en la salida real
        working-directory: iberia-ferroviaria/proyecto
        env:
          AUDIO_SYSTEM_CAPTURE: '1'
          GAME_TEST_URL: ${{ github.ref == 'refs/heads/main' && 'https://miguelcoxcaballero.github.io/putarenfe/iberia-ferroviaria/' || '' }}
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=tenfe sink_properties=device.description=Tenfe
          pactl set-default-sink tenfe
          xvfb-run -a node audio-salida-ui-test.mjs
          xvfb-run -a node audio-compatibilidad-ui-test.mjs
      - name: Verificar narraciones completas y controles
        working-directory: iberia-ferroviaria/proyecto
        env:
          GAME_TEST_URL: ${{ github.ref == 'refs/heads/main' && 'https://miguelcoxcaballero.github.io/putarenfe/iberia-ferroviaria/' || '' }}
        run: node narracion-ui-test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sonido-grabado-${{ github.run_id }}
          path: iberia-ferroviaria/outputs/audio-qa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: narraciones-verificadas-${{ github.run_id }}
          path: iberia-ferroviaria/outputs/tenfe-qa
      - name: Conservar la publicación verificada
        if: github.ref != 'refs/heads/main'
        run: |
          git config user.name "Tenfe build"
          git config user.email "tenfe-build@users.noreply.github.com"
          git add iberia-ferroviaria
          git reset -- iberia-ferroviaria/outputs/audio-qa
          if ! git diff --cached --quiet; then
            git commit -m "Construye Tenfe 6.5.2 con salida de audio verificada [skip ci]"
            git push
          fi
