name: Validar narración final
on:
  push:
    branches: [codex/narracion-final]
concurrency:
  group: narracion-final-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar voces, prioridades y cambios de etapa
        working-directory: iberia-ferroviaria/proyecto
        run: |
          node narration-test.mjs
          node voice-text-test.mjs
      - name: Preparar la publicación y el navegador
        working-directory: iberia-ferroviaria/proyecto
        run: |
          npm install --no-save --package-lock=false sharp@0.34.5 playwright@1.56.1
          npm run web:build
          npx playwright install --with-deps chromium
      - name: Probar voces, controles, reforma real y Auditorio
        working-directory: iberia-ferroviaria/proyecto
        run: node narracion-ui-test.mjs
      - name: Guardar pruebas visuales y resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: narracion-final-qa
          path: iberia-ferroviaria/outputs/tenfe-qa
      - name: Conservar la publicación verificada
        run: |
          git config user.name "Tenfe build"
          git config user.email "tenfe-build@users.noreply.github.com"
          git add iberia-ferroviaria
          if ! git diff --cached --quiet; then
            git commit -m "Construye narración final verificada de Tenfe [skip ci]"
            git push
          fi
