name: Unificar Tenfe
on:
  push:
    branches: [codex/unificar-tenfe]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Motor y regresiones
        working-directory: iberia-ferroviaria/proyecto
        run: npm test
      - name: Construir publicación
        working-directory: iberia-ferroviaria/proyecto
        run: npm run web:build
      - name: Conservar publicación comprobada
        run: |
          git config user.name "Tenfe build"
          git config user.email "tenfe-build@users.noreply.github.com"
          git add iberia-ferroviaria
          if ! git diff --cached --quiet; then
            git commit -m "Construye publicación verificada de Tenfe [skip ci]"
            git push
          fi
