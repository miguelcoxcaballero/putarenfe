name: Unificar Tenfe
on:
  push:
    branches: [codex/unificar-tenfe]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Motor y regresiones
        working-directory: iberia-ferroviaria/proyecto
        run: npm test
      - name: Construir publicación
        working-directory: iberia-ferroviaria/proyecto
        run: npm run web:build
      - name: Preparar Chromium
        working-directory: iberia-ferroviaria/proyecto
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Probar el juego publicado
        working-directory: iberia-ferroviaria/proyecto
        run: node tenfe-ui-test.mjs
      - name: Guardar capturas e informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tenfe-qa
          path: iberia-ferroviaria/outputs/tenfe-qa
      - name: Conservar publicación comprobada
        run: |
          git config user.name "Tenfe build"
          git config user.email "tenfe-build@users.noreply.github.com"
          git add iberia-ferroviaria
          if ! git diff --cached --quiet; then
            git commit -m "Construye publicación verificada de Tenfe [skip ci]"
            git push
          fi
