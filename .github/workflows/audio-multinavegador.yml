name: Diagnosticar silencio en navegadores
on:
  push:
    branches: [codex/audio-multinavegador]
jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: iberia-ferroviaria/proyecto
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium firefox webkit
          sudo apt-get install -y -qq pulseaudio ffmpeg xvfb
      - working-directory: iberia-ferroviaria/proyecto
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=tenfe sink_properties=device.description=Tenfe
          pactl set-default-sink tenfe
          xvfb-run -a node audio-multinavegador-test.mjs
